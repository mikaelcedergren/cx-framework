@if (resolvedHeading(); as title) {
  <header
    class="cx-hero"
    [class.cx-hero--stacked]="layout === 'stacked'"
    [class.cx-hero--split]="layout === 'split'"
    [class.cx-hero--cover]="layout === 'cover'"
    [class.cx-hero--flush]="variant === 'flush'"
    [class.cx-hero--media-start]="mediaSide === 'start'"
    [class.cx-hero--center]="align === 'center'"
    [class.cx-hero--parallax]="parallax"
    [class.cx-hero--fade-bottom]="fadeBottom"
    [class.cx-hero--under-masthead]="underMasthead"
  >
    @if (layout === "cover" && overlayOpacity > 0) {
      <div
        class="cx-hero__overlay"
        aria-hidden="true"
        [style.opacity]="overlayOpacity / 100"
      ></div>
    }
    <div class="cx-hero__copy">
      <div class="cx-hero__context">
        <ng-content select="[context], [cxHeroContext]" />
      </div>

      <div class="cx-hero__message">
        <h1 class="cx-hero__heading" [class]="headingClass">{{ title }}</h1>
        <div class="cx-hero__body">
          <ng-content select="[body], [cxHeroBody]" />
        </div>
      </div>

      <div class="cx-hero__actions">
        <ng-content select="[actions], [cxHeroActions]" />
      </div>

      <div class="cx-hero__meta">
        <ng-content select="[meta], [cxHeroMeta]" />
      </div>
    </div>

    <figure
      class="cx-hero__media"
      [attr.aria-hidden]="layout === 'cover' ? 'true' : null"
    >
      <div class="cx-hero__visual">
        <ng-content select="[media], [cxHeroMedia]" />
      </div>
      <figcaption class="cx-hero__caption">
        <ng-content select="[caption], [cxHeroCaption]" />
      </figcaption>
    </figure>
  </header>
}
