<aside
  #panelSurface
  class="cx-detail-panel"
  [class.cx-detail-panel--closing]="closing$()"
  [class.cx-detail-panel--fixed]="isFixed"
  [attr.aria-labelledby]="normalizedHeading ? headingId : null"
  [attr.aria-label]="normalizedHeading ? null : 'Detail panel'"
  [attr.aria-hidden]="closing$() ? 'true' : null"
  [attr.inert]="closing$() ? '' : null"
  (animationend)="onDismissAnimationEnd($event)"
>
  @if (resizable) {
    <div
      class="cx-detail-panel__resize-handle"
      [class.cx-detail-panel__resize-handle--active]="resizing$()"
      role="separator"
      tabindex="0"
      aria-orientation="vertical"
      [attr.aria-label]="resolvedResizeAriaLabel"
      [attr.aria-valuenow]="renderedWidthPx"
      [attr.aria-valuetext]="renderedWidthPx + ' pixels'"
      (pointerdown)="onResizePointerDown($event)"
      (pointermove)="onResizePointerMove($event)"
      (pointerup)="onResizePointerUp($event)"
      (pointercancel)="onResizePointerCancel($event)"
      (lostpointercapture)="onResizeLostPointerCapture($event)"
      (keydown)="onResizeKeydown($event)"
      (dblclick)="onResizeDoubleClick($event)"
    ></div>
  }

  <header class="cx-detail-panel__header">
    @if (icon || normalizedHeading) {
      <div
        class="cx-detail-panel__heading-group"
        [cxTooltip]="normalizedHeading"
        [cxTooltipOverflow]="true"
      >
        @if (icon; as iconName) {
          <cx-icon class="cx-detail-panel__heading-icon" [icon]="iconName" [size]="24" [mood]="mood" />
        }
        @if (normalizedHeading) {
          <h2 class="cx-detail-panel__heading" [id]="headingId" data-cx-tooltip-overflow>{{ normalizedHeading }}</h2>
        }
      </div>
    }

    <div class="cx-detail-panel__header-actions">
      <ng-content select="cx-status-tag[detail-panel-status]" />

      @if (hasMenuItems) {
        <cx-menu
          [presentation]="{ kind: 'trigger' }"
          [items]="menuItems ?? []"
          [ariaLabel]="resolvedMenuAriaLabel"
          align="end"
          (itemSelect)="onMenuItemSelect($event)"
        >
          <cx-icon-button
            cxMenuTrigger
            icon="menu-vertical"
            [ariaLabel]="resolvedMenuAriaLabel"
            variant="transparent"
          />
        </cx-menu>
      }
    </div>
  </header>

  @if (hasTabs) {
    <cx-tabs
      class="cx-detail-panel__tabs"
      [items]="tabs"
      [selectedId]="selectedTabId"
      [ariaLabel]="resolvedTabsAriaLabel"
      [controlsId]="tabPanelId"
      [transparent]="true"
      [divided]="false"
      (selectedIdChange)="onTabSelect($event)"
    />
  }

  <div
    #contentViewport
    class="cx-detail-panel__content-viewport"
    [attr.id]="hasTabs ? tabPanelId : null"
    [attr.role]="hasTabs ? 'tabpanel' : null"
    [attr.aria-labelledby]="hasTabs ? selectedTabButtonId : null"
    [attr.aria-label]="hasTabs && !selectedTabButtonId ? resolvedTabsAriaLabel : null"
    [attr.tabindex]="hasTabs ? '0' : null"
  >
    <div class="cx-detail-panel__content">
      <ng-content />
    </div>
  </div>

  @if (footer) {
    <footer class="cx-detail-panel__footer">
      <div class="cx-detail-panel__footer-slot">
        <ng-content select="[detail-panel-footer]" />
      </div>

      <cx-icon-button
        class="cx-detail-panel__footer-close"
        icon="arrow-right"
        [ariaLabel]="resolvedCloseAriaLabel"
        mood="default"
        (pressed)="dismiss()"
      />
    </footer>
  }
</aside>
