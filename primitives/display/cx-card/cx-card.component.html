<div class="cx-card">
  @if (resolvedHref; as href) {
    <a
      class="cx-card__activation"
      [attr.href]="href"
      [attr.target]="target?.trim() || null"
      [attr.rel]="resolvedRel"
      [attr.aria-label]="activationLabel"
    ></a>
  } @else if (interactive) {
    <button
      type="button"
      class="cx-card__activation"
      [attr.aria-label]="activationLabel"
      (click)="onActivate()"
    ></button>
  }

  <div class="cx-card__header">
    <div class="cx-card__identity">
      @if (icon; as iconName) {
        <cx-icon class="cx-card__icon" [name]="iconName" [size]="20" />
      }
      @if (hasHeading()) {
        <div class="cx-card__heading">{{ heading!.trim() }}</div>
      }
    </div>

    <div class="cx-card__header-actions">
      <div #cardMeta class="cx-card__meta">
        <ng-content select="[slot=meta], [cxCardMeta]" />
      </div>

      @if (hasMenuItems()) {
        <cx-menu
          [presentation]="{ kind: 'trigger' }"
          class="cx-card__menu"
          [items]="menuItems ?? []"
          [ariaLabel]="resolvedMenuAriaLabel()"
          align="end"
          (itemSelect)="onMenuItemSelect($event)"
        >
          <cx-icon-button
            cxMenuTrigger
            icon="menu-vertical"
            variant="transparent"
            [ariaLabel]="resolvedMenuAriaLabel()"
          />
        </cx-menu>
      }
    </div>
  </div>

  <div #cardContent class="cx-card__content">
    <ng-content />
  </div>
</div>
