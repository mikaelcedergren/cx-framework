<div class="cx-card">
  @if (resolvedHref; as href) {
    <a
      class="cx-card__activation"
      [attr.href]="href"
      [attr.target]="target?.trim() || null"
      [attr.rel]="resolvedRel"
      [attr.aria-label]="activationLabel"
    ></a>
  } @else if (interactive) {
    <button
      type="button"
      class="cx-card__activation"
      [attr.aria-label]="activationLabel"
      (click)="onActivate()"
    ></button>
  }

  <div class="cx-card__header">
    <div class="cx-card__identity">
      @if (icon; as iconName) {
        <cx-icon class="cx-card__icon" [icon]="iconName" [size]="20" />
      }
      @if (hasHeading()) {
        <div class="cx-card__heading">{{ heading!.trim() }}</div>
      }
    </div>

    <div class="cx-card__header-actions">
      <div #cardMeta class="cx-card__meta">
        <ng-content select="[slot=meta], [cxCardMeta]" />
      </div>

      @if (hasMenuItems()) {
        <cx-menu
          [presentation]="{ kind: 'trigger' }"
          class="cx-card__menu"
          [items]="menuItems ?? []"
          [ariaLabel]="resolvedMenuAriaLabel()"
          align="end"
          (itemSelect)="onMenuItemSelect($event)"
        >
          <cx-icon-button
            cxMenuTrigger
            icon="menu-vertical"
            variant="transparent"
            [ariaLabel]="resolvedMenuAriaLabel()"
          />
        </cx-menu>
      }
    </div>
  </div>

  @if (hasTabs) {
    <cx-tabs
      class="cx-card__tabs"
      [items]="tabs ?? []"
      [selectedId]="selectedTabId"
      [ariaLabel]="resolvedTabsAriaLabel"
      [controlsId]="contentId"
      [transparent]="true"
      [divided]="false"
      (selectedIdChange)="onTabSelect($event)"
    />
  }

  <div
    #cardViewport
    class="cx-card__viewport"
    [id]="contentId"
    [class.cx-card__viewport--expandable]="expansionEnabled"
    [class.cx-card__viewport--clamped]="clamped()"
    [style.maxHeight.px]="viewportMaxHeight()"
    [attr.role]="hasTabs ? 'tabpanel' : null"
    [attr.aria-labelledby]="hasTabs ? selectedTabButtonId : null"
    [attr.aria-label]="hasTabs && !selectedTabButtonId ? resolvedTabsAriaLabel : null"
    [attr.tabindex]="hasTabs ? '0' : null"
    (focusin)="onViewportFocusIn($event)"
  >
    <div #cardContent class="cx-card__content">
      <ng-content />
    </div>
  </div>

  @if (overflowing()) {
    <button
      type="button"
      class="cx-card__expand"
      [attr.aria-expanded]="expanded()"
      [attr.aria-controls]="contentId"
      [attr.aria-label]="expandAriaLabel()"
      (click)="toggleExpanded()"
    >
      <cx-icon class="cx-card__expand-chevron" icon="chevron-down" [size]="16" />
    </button>
  }
</div>
