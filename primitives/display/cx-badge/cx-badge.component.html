<span
  class="cx-badge"
  [class.cx-badge--inline]="placement === 'inline'"
  [class.cx-badge--corner]="placement === 'corner'"
  [class.cx-badge--visible]="visible"
  [class.cx-badge--with-value]="hasValue()"
  [class.cx-badge--default]="mood === 'default'"
  [class.cx-badge--accent]="mood === 'accent'"
  [class.cx-badge--success]="mood === 'success'"
  [class.cx-badge--warning]="mood === 'warning'"
  [class.cx-badge--danger]="mood === 'danger'"
  [style.--cx-badge-indicator-width]="indicatorWidth()"
  [style.--cx-badge-indicator-height]="indicatorHeight()"
>
  <span
    class="cx-badge__content"
    [class.cx-badge__content--cutout]="placement === 'corner' && showsIndicator()"
  >
    <ng-content />
  </span>

  @if (showsIndicator()) {
    <span
      #indicator
      class="cx-badge__indicator"
      [class.cx-badge__indicator--dot]="!hasValue()"
      [class.cx-badge__indicator--count]="showsCount()"
      [class.cx-badge__indicator--text]="showsText()"
      [attr.role]="ariaLabel?.trim() ? 'img' : null"
      [attr.aria-label]="ariaLabel?.trim() || null"
      [attr.aria-hidden]="ariaLabel?.trim() ? null : 'true'"
    >
      @if (showsCount()) {
        <span class="cx-badge__value">{{ displayValue() }}</span>
      } @else if (showsText()) {
        <span class="cx-badge__value cx-badge__value--text">{{ displayText() }}</span>
      }
    </span>
  }
</span>
