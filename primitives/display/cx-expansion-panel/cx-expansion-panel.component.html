<div
  class="cx-expansion-panel"
  [class.cx-expansion-panel--expanded]="expanded$()"
  [class.cx-expansion-panel--flat]="variant === 'flat'"
>
  <div class="cx-expansion-panel__header-row">
    <button
      type="button"
      class="cx-expansion-panel__trigger"
      [attr.aria-expanded]="expanded$()"
      [attr.aria-controls]="contentId"
      (click)="toggle()"
    >
      <span class="cx-expansion-panel__header">
        <span class="cx-expansion-panel__title">{{ heading }}</span>
      </span>
    </button>

    <span class="cx-expansion-panel__meta">
      <span class="cx-expansion-panel__actions">
        <ng-content select="[actions]" />
      </span>

      <button
        type="button"
        class="cx-expansion-panel__toggle"
        [attr.aria-label]="(expanded$() ? 'Collapse ' : 'Expand ') + heading"
        [attr.aria-expanded]="expanded$()"
        [attr.aria-controls]="contentId"
        (click)="toggle()"
      >
        <cx-icon
          class="cx-expansion-panel__chevron"
          icon="chevron-down"
          [size]="16"
        />
      </button>
    </span>
  </div>

  <!-- `inert` is what makes a closed panel closed, and it is deliberately an
       attribute rather than a style. The collapsed row is zero-height and its
       body is transparent, but neither of those takes anything out of the tab
       order or out of the accessibility tree: without this, a keyboard user tabs
       from the heading straight into a link nobody can see. `inert` covers focus,
       pointer events and screen readers in one place, and no stylesheet — print,
       theme, or consumer override — can undo it. -->
  <div
    class="cx-expansion-panel__content-shell"
    [class.cx-expansion-panel__content-shell--expanded]="expanded$()"
    [id]="contentId"
    [attr.inert]="expanded$() ? null : ''"
  >
    <div class="cx-expansion-panel__content-clip">
      <div class="cx-expansion-panel__content">
        <ng-content />
      </div>
    </div>
  </div>
</div>
