@if (loading$()) {
  <div class="cx-image__fallback" aria-busy="true">
    <cx-spinner mood="default" size="default" />
  </div>
} @else if (showImage$()) {
  <img
    class="cx-image"
    [style.object-fit]="hostObjectFit"
    [attr.loading]="image$().loading"
    [attr.fetchpriority]="image$().fetchPriority"
    [attr.width]="image$().intrinsicWidth ?? null"
    [attr.height]="image$().intrinsicHeight ?? null"
    [attr.srcset]="image$().srcset || null"
    [attr.sizes]="image$().sizes || null"
    [src]="image$().src"
    [alt]="image$().alt"
    (load)="onImageLoad()"
    (error)="onImageError()"
    (click)="onClick()"
  />
} @else if (showFallback$()) {
  <div
    class="cx-image__fallback"
    role="img"
    [attr.aria-label]="fallbackText$() || null"
  >
    <cx-icon icon="image" [size]="24" />
    @if (fallbackText$()) {
      <span>{{ fallbackText$() }}</span>
    }
  </div>
}
