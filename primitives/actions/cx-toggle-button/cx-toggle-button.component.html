@if (hasVisibleContent) {
  <button
    type="button"
    class="cx-toggle-button"
    [class.cx-toggle-button--selected]="selected$()"
    [class.cx-toggle-button--icon-only]="isIconOnly"
    [disabled]="disabled"
    [attr.aria-pressed]="selected$()"
    [attr.aria-label]="resolvedAriaLabel"
    [cxTooltip]="visibleText"
    [cxTooltipOverflow]="true"
    (click)="toggle()"
  >
    @if (displayIcon; as iconName) {
      <cx-icon class="cx-toggle-button__icon" [name]="iconName" [size]="size === 'small' ? '14' : '16'" aria-hidden="true" />
    }
    @if (visibleText) {
      <span data-cx-tooltip-overflow>{{ visibleText }}</span>
    }
  </button>
}
