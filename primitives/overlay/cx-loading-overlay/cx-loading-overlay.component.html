@if (isOpen$()) {
  <!-- No click handler: the backdrop of a blocking wait is a scrim, not an exit.
       The trap lives here rather than on the surface so the surface itself is
       inside the trapped region and can be the initial focus target. -->
  <div
    class="cx-loading-overlay-backdrop"
    role="presentation"
    cdkTrapFocus
    [cdkTrapFocusAutoCapture]="true"
    (keydown)="onKeydown($event)"
    (mousedown)="onBackdropMousedown($event)"
  >
    <section
      class="cx-loading-overlay"
      role="dialog"
      aria-modal="true"
      [attr.aria-label]="resolvedAriaLabel"
      tabindex="-1"
      cdkFocusInitial
    >
      <!-- The spinner keeps its own "Loading" announcement only while no status
           speaks for it; with a status the live region below is the narrator. -->
      <cx-spinner size="large" mood="primary" [attr.aria-hidden]="hasStatus$() ? 'true' : null" />

      @for (entry of entries$(); track entry.key) {
        <cx-text-shimmer class="cx-loading-overlay__status" [text]="entry.text" aria-hidden="true" />
      }

      <!-- Always rendered, never conditional: a live region has to exist before
           its content changes for screen readers to announce the change. -->
      <span class="cx-loading-overlay__live" role="status">{{ displayed$() }}</span>
    </section>
  </div>
}
