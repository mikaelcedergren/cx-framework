@if (isOpen$()) {
  @if (currentImage$(); as image) {
    <div
      class="cx-lightbox"
      [class.cx-lightbox--gallery]="hasNavigation$()"
      role="dialog"
      aria-modal="true"
      cdkTrapFocus
      [cdkTrapFocusAutoCapture]="true"
      [attr.aria-label]="ariaLabel"
      [attr.aria-keyshortcuts]="hasNavigation$() ? 'Escape ArrowLeft ArrowRight' : 'Escape'"
      (click)="onBackdropClick($event)"
    >
      @if (hasNavigation$()) {
        <cx-icon-button
          class="cx-lightbox__control cx-lightbox__navigation cx-lightbox__previous"
          icon="chevron-left"
          [rounded]="true"
          [ariaLabel]="previousAriaLabel"
          [disabled]="!canGoPrevious$()"
          (pressed)="showPreviousImage()"
        />
      }

      <figure class="cx-lightbox__surface" tabindex="-1" cdkFocusInitial>
        <img class="cx-lightbox__image" [src]="image.src" [alt]="image.alt" />
        @if (image.caption || hasNavigation$()) {
          <figcaption class="cx-lightbox__meta">
            @if (image.caption) {
              <span class="cx-lightbox__caption">{{ image.caption }}</span>
            }
            @if (hasNavigation$()) {
              <span
                class="cx-lightbox__position"
                role="status"
                aria-live="polite"
                aria-atomic="true"
                [attr.aria-label]="positionLabel$()"
              >
                {{ positionText$() }}
              </span>
            }
          </figcaption>
        }
      </figure>

      @if (hasNavigation$()) {
        <cx-icon-button
          class="cx-lightbox__control cx-lightbox__navigation cx-lightbox__next"
          icon="chevron-right"
          [rounded]="true"
          [ariaLabel]="nextAriaLabel"
          [disabled]="!canGoNext$()"
          (pressed)="showNextImage()"
        />
      }
    </div>
  }
}
