@if (open) {
  @if (showBackdrop) {
    <cx-popover-backdrop #backdrop (pressed)="backdropPressed.emit()" />
  }

  <div
    #surface
    class="cx-popover"
    data-cx-popover-surface
    [class.cx-popover--top]="placement === 'top'"
    [class.cx-popover--bottom]="placement === 'bottom'"
    [class.cx-popover--left]="placement === 'left'"
    [class.cx-popover--right]="placement === 'right'"
    [class.cx-popover--raised]="surfaceVariant === 'raised'"
    [class.cx-popover--grouped]="surfaceVariant === 'grouped'"
    [attr.id]="surfaceId || null"
    [attr.role]="role || null"
    [attr.aria-label]="ariaLabel || null"
    [style.width.px]="width"
    [style.min-width.px]="minWidth"
    [style.max-width]="resolvedMaxWidth"
    [style.max-height]="resolvedMaxHeight"
    [style.left.px]="left"
    [style.top.px]="top"
    [style.bottom.px]="bottom"
  >
    <div #scrollBody class="cx-popover__body" data-cx-popover-scroll-container>
      @if (surfaceVariant === 'grouped' && normalizedTitle) {
        <div class="cx-popover__island cx-popover__island--heading">
          <ng-container [ngTemplateOutlet]="headingRow" />
        </div>
      }

      <div #content class="cx-popover__content" [class.cx-popover__island]="surfaceVariant !== 'grouped'">
        @if (surfaceVariant !== 'grouped' && normalizedTitle) {
          <ng-container [ngTemplateOutlet]="headingRow" />
        }

        <ng-content />
      </div>
    </div>
    <cx-popover-scrollbar [viewport]="surfaceVariant === 'grouped' ? scrollBody : content" />
  </div>
}

<!--
  One heading row for both surface variants, so the projected actions have a
  single destination. Two <ng-content> elements with the same selector would
  fill only the first, leaving the other variant's heading empty.
-->
<ng-template #headingRow>
  <cx-option-group class="cx-popover__heading" [label]="normalizedTitle ?? ''" variant="heading">
    <!--
      ngProjectAs is required. A forwarded <ng-content> carries no attributes
      of its own, so without it the content matches none of cx-option-group's
      slots and is silently dropped.
    -->
    <ng-content select="[actions]" ngProjectAs="[actions]" />
  </cx-option-group>
</ng-template>
