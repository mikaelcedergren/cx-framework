<div class="cx-option-group" [class.cx-option-group--heading]="variant === 'heading'">
  <span class="cx-option-group__label" [cxTooltip]="label" [cxTooltipOverflow]="true">{{ label }}</span>

  @if (description) {
    <span
      class="cx-option-group__description"
      [cxTooltip]="description"
      [cxTooltipOverflow]="true"
    >{{ description }}</span>
  }

  <span class="cx-option-group__actions">
    <ng-content select="[actions]" />
  </span>
</div>
