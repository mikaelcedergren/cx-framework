<!-- The row owns the visual state so independent trailing controls share the
     option background without ever nesting one button inside another. -->
<div
  class="cx-option__row"
  [class.cx-option__row--selected]="selected && selectedHighlight"
  [class.cx-option__row--active]="active"
  [class.cx-option__row--submenu-open]="submenu === 'open'"
  [class.cx-option__row--static]="!clickable"
  [class.cx-option__row--disabled]="disabled"
>
  <!-- Tooltips sit off the list axis (right) so an open tooltip never covers sibling options. -->
  @if (clickable) {
    <button
      #control
      type="button"
      class="cx-option"
      [class.cx-option--primary]="mood === 'primary'"
      [class.cx-option--accent]="mood === 'accent'"
      [class.cx-option--info]="mood === 'info'"
      [class.cx-option--success]="mood === 'success'"
      [class.cx-option--warning]="mood === 'warning'"
      [class.cx-option--danger]="mood === 'danger'"
      [class.cx-option--selected]="selected && selectedHighlight"
      [class.cx-option--active]="active"
      [class.cx-option--submenu-open]="submenu === 'open'"
      [class.cx-option--with-checkbox]="showCheckbox"
      [class.cx-option--without-icons]="!showCheckbox && !showPrependIcon() && !appendIconName()"
      [class.cx-option--append-only]="hasAppendOnlyLayout()"
      [class.cx-option--with-trailing]="!!appendIconName() || hasShortcut() || !!description"
      [class.cx-option--disabled]="disabled"
      [disabled]="useNativeDisabled()"
      [attr.role]="role || null"
      [attr.aria-disabled]="disabled ? 'true' : null"
      [attr.aria-selected]="ariaSelectedValue()"
      [attr.aria-checked]="ariaCheckedValue()"
      [attr.aria-posinset]="ariaPosInSet ?? null"
      [attr.aria-setsize]="ariaSetSize ?? null"
      [cxTooltip]="tooltipText()"
      [cxTooltipOverflow]="!hasExplicitTooltip()"
      cxTooltipPosition="right"
      (click)="onPrimaryClick($event)"
      (keydown)="onPrimaryKeydown($event)"
    >
      <ng-container [ngTemplateOutlet]="optionContent" />
    </button>
  } @else {
    <div
      #control
      class="cx-option cx-option--static"
      [class.cx-option--primary]="mood === 'primary'"
      [class.cx-option--accent]="mood === 'accent'"
      [class.cx-option--info]="mood === 'info'"
      [class.cx-option--success]="mood === 'success'"
      [class.cx-option--warning]="mood === 'warning'"
      [class.cx-option--danger]="mood === 'danger'"
      [class.cx-option--selected]="selected && selectedHighlight"
      [class.cx-option--submenu-open]="submenu === 'open'"
      [class.cx-option--with-checkbox]="showCheckbox"
      [class.cx-option--without-icons]="!showCheckbox && !showPrependIcon() && !appendIconName()"
      [class.cx-option--append-only]="hasAppendOnlyLayout()"
      [class.cx-option--with-trailing]="!!appendIconName() || hasShortcut() || !!description"
      [class.cx-option--disabled]="disabled"
      [attr.role]="role || null"
      [attr.inert]="disabled && !hasExplicitTooltip() ? '' : null"
      [attr.tabindex]="hasExplicitTooltip() ? 0 : null"
      [attr.aria-disabled]="disabled ? 'true' : null"
      [attr.aria-selected]="ariaSelectedValue()"
      [attr.aria-checked]="ariaCheckedValue()"
      [attr.aria-posinset]="ariaPosInSet ?? null"
      [attr.aria-setsize]="ariaSetSize ?? null"
      [cxTooltip]="tooltipText()"
      [cxTooltipOverflow]="!hasExplicitTooltip()"
      cxTooltipPosition="right"
      (click)="onPrimaryClick($event)"
      (keydown)="onPrimaryKeydown($event)"
    >
      <ng-container [ngTemplateOutlet]="optionContent" />
    </div>
  }

  <span
    #controlSlot
    class="cx-option__control-slot"
    (click)="stopControlEvent($event)"
    (keydown)="stopControlEvent($event)"
    (pointerdown)="stopControlEvent($event)"
  >
    <ng-content select="[control]" />
  </span>
</div>

<ng-template #optionContent>
  @if (showCheckbox) {
    <span class="cx-option__checkbox" [class.cx-option__checkbox--selected]="selected" aria-hidden="true">
      <span class="cx-option__checkbox-check"></span>
    </span>
  }

  @if (showPrependIcon(); as prependIconValue) {
    <span class="cx-option__icon cx-option__icon--prepend" aria-hidden="true">
      <cx-icon [icon]="prependIconValue" size="16" />
    </span>
  }

  <span class="cx-option__text">
    <span #labelContent class="cx-option__content">
      <span class="cx-option__label" data-cx-tooltip-overflow>{{ label }}</span>
    </span>

    @if (description) {
      <span class="cx-option__description" data-cx-tooltip-overflow>{{ description }}</span>
    }
  </span>

  <span class="cx-option__trailing">
    <span #appendSlot class="cx-option__append-slot">
      <ng-content select="[append]" />
    </span>

    @if (hasShortcut()) {
      <span class="cx-option__shortcut" aria-hidden="true">
        <cx-shortcut-key [parts]="shortcutParts ?? []" />
      </span>
    }

    @if (appendIconName(); as appendIconValue) {
      <span class="cx-option__icon cx-option__icon--append" aria-hidden="true">
        <cx-icon [icon]="appendIconValue" size="16" />
      </span>
    }
  </span>
</ng-template>
