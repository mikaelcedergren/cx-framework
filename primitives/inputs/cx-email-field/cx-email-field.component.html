<div
  class="cx-email-field"
  [class.cx-email-field--small]="size === 'small'"
  [class.cx-email-field--large]="size === 'large'"
>
  @if (label.trim()) {
    <div class="cx-email-field__header">
      <div class="cx-email-field__label" [id]="labelId">{{ label }}</div>
      @if (optional) {
        <div class="cx-email-field__optional">Optional</div>
      }
    </div>
  }

  <div
    class="cx-email-field__field-shell"
    [class.cx-email-field__field-shell--focused]="isFocused$()"
    [class.cx-email-field__field-shell--disabled]="disabled"
    [class.cx-email-field__field-shell--loading]="loading"
    [class.cx-email-field__field-shell--error]="hasError$()"
    [attr.aria-busy]="loading ? 'true' : null"
  >
    <input
      #field
      type="email"
      inputmode="email"
      autocapitalize="none"
      spellcheck="false"
      class="cx-email-field__field"
      name="email"
      autocomplete="email"
      [disabled]="disabled || loading"
      [value]="value$()"
      [attr.aria-label]="resolvedAriaLabel"
      [attr.aria-labelledby]="resolvedAriaLabelledBy"
      [attr.aria-describedby]="resolvedAriaDescribedBy"
      [attr.aria-invalid]="hasError$() ? 'true' : null"
      (input)="onInput($event)"
      (focus)="onFocus()"
      (blur)="onBlur()"
      (keydown.escape)="onEscapeKey()"
    />

    @if (loading) {
      <span class="cx-email-field__loading" aria-hidden="true">
        <cx-spinner size="small" mood="default" />
      </span>
    }

    @if (hasClear$()) {
      <button type="button" class="cx-email-field__clear" aria-label="Clear" (click)="onClear($event)">
        <cx-icon name="remove" [size]="14" />
      </button>
    }
  </div>

  @if (showHint$() || validationMessages$().length > 0) {
    <div class="cx-email-field__messages" [id]="messagesId">
      @if (showHint$()) {
        <div class="cx-email-field__hint">{{ hint!.trim() }}</div>
      }

      @if (validationMessages$().length > 0) {
        <cx-validation-message [messages]="validationMessages$()" />
      }
    </div>
  }
</div>
