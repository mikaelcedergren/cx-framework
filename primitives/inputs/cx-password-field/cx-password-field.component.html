<div
  class="cx-password-field"
  [class.cx-password-field--small]="size === 'small'"
  [class.cx-password-field--large]="size === 'large'"
>
  @if (label.trim()) {
    <div class="cx-password-field__header">
      <div class="cx-password-field__label" [id]="labelId">{{ label }}</div>
      @if (optional) {
        <div class="cx-password-field__optional">Optional</div>
      }
    </div>
  }

  <div
    class="cx-password-field__field-shell"
    [class.cx-password-field__field-shell--focused]="isFocused$()"
    [class.cx-password-field__field-shell--disabled]="disabled"
    [class.cx-password-field__field-shell--loading]="loading"
    [class.cx-password-field__field-shell--error]="hasError$()"
    [attr.aria-busy]="loading ? 'true' : null"
  >
    <input
      #field
      [type]="revealed$() ? 'text' : 'password'"
      class="cx-password-field__field"
      [attr.name]="resolvedName"
      [attr.autocomplete]="resolvedAutocomplete"
      [disabled]="disabled || loading"
      [value]="value$()"
      [attr.aria-label]="resolvedAriaLabel"
      [attr.aria-labelledby]="resolvedAriaLabelledBy"
      [attr.aria-describedby]="resolvedAriaDescribedBy"
      [attr.aria-invalid]="hasError$() ? 'true' : null"
      (input)="onInput($event)"
      (focus)="onFocus()"
      (blur)="onBlur()"
      (keydown.escape)="onEscapeKey()"
    />

    @if (loading) {
      <span class="cx-password-field__loading" aria-hidden="true">
        <cx-spinner size="small" mood="default" />
      </span>
    }

    @if (hasClear$()) {
      <button type="button" class="cx-password-field__clear" aria-label="Clear" (click)="onClear($event)">
        <cx-icon icon="remove" [size]="14" />
      </button>
    }

    <button
      type="button"
      class="cx-password-field__toggle"
      [class.cx-password-field__toggle--active]="revealed$()"
      [attr.aria-label]="revealed$() ? 'Hide password' : 'Show password'"
      [attr.aria-pressed]="revealed$()"
      [disabled]="disabled || loading"
      (click)="onToggle()"
    >
      @if (revealed$()) {
        <span class="cx-password-field__reveal" aria-hidden="true">
          <svg class="cx-password-field__reveal-ring" viewBox="0 0 24 24" fill="none" focusable="false">
            <g transform="rotate(-90 12 12)">
              <circle
                class="cx-password-field__reveal-progress"
                cx="12"
                cy="12"
                r="8.25"
                pathLength="1"
                [style.stroke-dashoffset]="revealOffsetStyle()"
              />
            </g>
          </svg>
        </span>
      } @else {
        <cx-icon icon="watch" [size]="16" />
      }
    </button>
  </div>

  @if (showHint$() || validationMessages$().length > 0) {
    <div class="cx-password-field__messages" [id]="messagesId">
      @if (showHint$()) {
        <div class="cx-password-field__hint">{{ hint!.trim() }}</div>
      }

      @if (validationMessages$().length > 0) {
        <cx-validation-message [messages]="validationMessages$()" />
      }
    </div>
  }
</div>
