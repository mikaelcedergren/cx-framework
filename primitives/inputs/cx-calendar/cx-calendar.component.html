<div
  class="cx-calendar"
  [class.cx-calendar--disabled]="disabled"
  [class.cx-calendar--embedded]="variant === 'embedded'"
  [class.cx-calendar--range]="selectionMode === 'range'"
>
  <div class="cx-calendar__header">
    <cx-icon-button icon="arrow-left" variant="transparent" size="small" ariaLabel="Previous month" [disabled]="disabled" (pressed)="onPreviousMonth()" />
    <div class="cx-calendar__controls">
      <cx-dropdown class="cx-calendar__select cx-calendar__select--month" label="" ariaLabel="Month" size="small" [availableValues]="monthOptions" [value]="viewMonthValue$()" [disabled]="disabled" (valueChange)="onMonthChange($event)" />
      <cx-dropdown class="cx-calendar__select cx-calendar__select--year" label="" ariaLabel="Year" size="small" [availableValues]="yearOptions$()" [value]="viewYearValue$()" [disabled]="disabled" (valueChange)="onYearChange($event)" />
    </div>
    <cx-icon-button icon="arrow-right" variant="transparent" size="small" ariaLabel="Next month" [disabled]="disabled" (pressed)="onNextMonth()" />
  </div>

  <div class="cx-calendar__content">
    <div class="cx-calendar__weekdays">
      @for (weekday of weekdayLabels$(); track weekday) {
        <div class="cx-calendar__weekday">{{ weekday }}</div>
      }
    </div>

    <div class="cx-calendar__grid" role="grid" [attr.aria-label]="gridAriaLabel$()" (mouseleave)="onDayLeave()">
      @for (day of calendarDays$(); track day.key) {
        <button
          type="button"
          class="cx-calendar__day"
          [class.cx-calendar__day--outside]="!day.inCurrentMonth"
          [class.cx-calendar__day--today]="day.isToday"
          [class.cx-calendar__day--selected]="isSelectedDay(day)"
          [class.cx-calendar__day--range]="isInRange(day)"
          [class.cx-calendar__day--range-start]="isRangeStartDay(day)"
          [class.cx-calendar__day--range-end]="isRangeEndDay(day)"
          [class.cx-calendar__day--range-preview-end]="isRangePreviewEnd(day)"
          [disabled]="disabled || isOutsideRange(day)"
          [attr.tabindex]="day.key === tabbableDayKey$() ? 0 : -1"
          [attr.data-cx-calendar-day]="day.key"
          [attr.aria-label]="dayAriaLabel(day)"
          [attr.aria-pressed]="isAriaSelectedDay(day)"
          [attr.aria-current]="day.isToday ? 'date' : null"
          (click)="onDaySelect(day)"
          (focus)="onDayFocus(day)"
          (keydown)="onDayKeydown($event, day)"
          (mouseenter)="onDayHover(day)"
        >
          {{ day.day }}
        </button>
      }
    </div>
  </div>
</div>
