<div
  class="cx-search-field"
  (keydown.escape)="onEscape($event)"
  (focusin)="onFocusIn()"
  (focusout)="onFocusOut($event)"
>
  <cx-text-field
    [label]="label"
    [ariaLabel]="ariaLabel"
    [hint]="hint"
    [optional]="optional"
    [disabled]="disabled"
    [loading]="loading"
    [clearable]="clearable"
    [size]="size"
    prependIcon="search"
    [value]="value$()"
    [validation]="validation"
    (valueChange)="onValueChange($event)"
  />
</div>
