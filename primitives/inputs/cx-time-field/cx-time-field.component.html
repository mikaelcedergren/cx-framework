<div
  class="cx-time-field"
  [class.cx-time-field--small]="size$() === 'small'"
  [class.cx-time-field--large]="size$() === 'large'"
>
  @if (label.trim()) {
    <div class="cx-time-field__header">
      <div class="cx-time-field__label" [id]="labelId">{{ label }}</div>

      @if (optional) {
        <div class="cx-time-field__optional">Optional</div>
      }
    </div>
  }

  <div
    class="cx-time-field__field-shell"
    [class.cx-time-field__field-shell--focused]="shellFocused$()"
    [class.cx-time-field__field-shell--disabled]="disabled"
    [class.cx-time-field__field-shell--loading]="loading"
    [class.cx-time-field__field-shell--error]="hasError$()"
    [class.cx-time-field__field-shell--empty]="isEmpty$()"
    role="group"
    [attr.aria-invalid]="hasError$() ? 'true' : null"
    [attr.aria-labelledby]="resolvedGroupAriaLabelledBy"
    [attr.aria-describedby]="resolvedGroupAriaDescribedBy"
    [attr.aria-label]="resolvedGroupAriaLabel"
    [attr.aria-busy]="loading ? 'true' : null"
    (mousedown)="onShellMousedown($event)"
  >
    <div class="cx-time-field__segments">
      <div class="cx-time-field__clock">
        <input
          #hourField
          class="cx-time-field__segment-input"
          type="text"
          inputmode="numeric"
          maxlength="2"
          autocomplete="off"
          spellcheck="false"
          [value]="hourText$()"
          [disabled]="isLocked$()"
          [attr.aria-label]="hourAriaLabel"
          (focus)="onSegmentFocus('hour')"
          (pointerup)="onSegmentPointerUp('hour', $event)"
          (input)="onSegmentInput('hour', $event)"
          (keydown)="onSegmentKeydown('hour', $event)"
          (paste)="onSegmentPaste($event)"
        />

        <span class="cx-time-field__separator" aria-hidden="true">:</span>

        <input
          #minuteField
          class="cx-time-field__segment-input"
          type="text"
          inputmode="numeric"
          maxlength="2"
          autocomplete="off"
          spellcheck="false"
          [value]="minuteText$()"
          [disabled]="isLocked$()"
          [attr.aria-label]="minuteAriaLabel"
          (focus)="onSegmentFocus('minute')"
          (pointerup)="onSegmentPointerUp('minute', $event)"
          (input)="onSegmentInput('minute', $event)"
          (keydown)="onSegmentKeydown('minute', $event)"
          (paste)="onSegmentPaste($event)"
        />
      </div>

      @if (is12h$()) {
        <button
          #meridiemButton
          type="button"
          class="cx-time-field__meridiem"
          [disabled]="isLocked$()"
          [attr.aria-label]="'Meridiem ' + meridiem$()"
          (click)="onMeridiemClick()"
          (keydown)="onMeridiemKeydown($event)"
        >
          {{ meridiem$() }}
        </button>
      }
    </div>

    @if (loading) {
      <span class="cx-time-field__loading" aria-hidden="true">
        <cx-spinner size="16" mood="default" />
      </span>
    }

    @if (hasClear$()) {
      <button type="button" class="cx-time-field__clear" aria-label="Clear" (click)="onClear($event)">
        <cx-icon name="remove" [size]="14" />
      </button>
    }
  </div>

  @if (showHint$() || validationMessages$().length > 0) {
    <div class="cx-time-field__messages" [id]="messagesId">
      @if (showHint$()) {
        <div class="cx-time-field__hint">{{ hint!.trim() }}</div>
      }

      @if (validationMessages$().length > 0) {
        <cx-validation-message [messages]="validationMessages$()" />
      }
    </div>
  }
</div>
